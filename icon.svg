<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ぐらぐらタワー">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3556"/><stop offset="1" stop-color="#141a30"/></linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d9a2"/><stop offset="1" stop-color="#d9a964"/></linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eecb8c"/><stop offset="1" stop-color="#cf9b55"/></linearGradient>
    <pattern id="g" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 7h14" stroke="#a86f2b" stroke-opacity=".18" stroke-width="2"/></pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="438" rx="188" ry="26" fill="#000" opacity=".35"/>
  <!-- 下の段: 3 本 -->
  <g>
    <rect x="96"  y="350" width="96" height="62" rx="10" fill="url(#w1)"/><rect x="96"  y="350" width="96" height="62" rx="10" fill="url(#g)"/>
    <rect x="208" y="350" width="96" height="62" rx="10" fill="url(#w2)"/><rect x="208" y="350" width="96" height="62" rx="10" fill="url(#g)"/>
    <rect x="320" y="350" width="96" height="62" rx="10" fill="url(#w1)"/><rect x="320" y="350" width="96" height="62" rx="10" fill="url(#g)"/>
  </g>
  <!-- 2 段め: 横にのびた長い 1 本 -->
  <g>
    <rect x="76"  y="282" width="360" height="62" rx="10" fill="url(#w2)"/><rect x="76" y="282" width="360" height="62" rx="10" fill="url(#g)"/>
  </g>
  <!-- 3 段め (まんなかが空いている) と、のせかけの 1 本 -->
  <g>
    <rect x="96"  y="214" width="96" height="62" rx="10" fill="url(#w1)"/><rect x="96"  y="214" width="96" height="62" rx="10" fill="url(#g)"/>
    <rect x="320" y="214" width="96" height="62" rx="10" fill="url(#w1)"/><rect x="320" y="214" width="96" height="62" rx="10" fill="url(#g)"/>
  </g>
  <g transform="translate(0 -4)">
    <rect x="176" y="146" width="200" height="62" rx="10" fill="url(#w2)" transform="rotate(-4 276 177)"/>
    <rect x="176" y="146" width="200" height="62" rx="10" fill="url(#g)" transform="rotate(-4 276 177)"/>
  </g>
</svg>
